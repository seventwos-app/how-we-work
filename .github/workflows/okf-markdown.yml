name: OKF Markdown Validation

# CI-only check: validates changed markdown against this repo's Open
# Knowledge Format (OKF) v0.2 bundle convention on every pull request.
# Deliberately does not open issues, post comments, or write to the repo --
# this repo is a small public vision-doc bundle, and its own
# .github/copilot-instructions.md says not to add CI/tooling beyond what's
# explicitly requested. This workflow is scoped to the minimum: a
# pass/fail check visible only on the PR itself.
on:
  pull_request:
    paths:
      - "**/*.md"

jobs:
  validate-okf-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate changed markdown against OKF v0.2
        run: python scripts/okf/validate_okf_markdown.py --changed
