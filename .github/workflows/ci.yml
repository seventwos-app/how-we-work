name: CI

# Provides the status checks required by the organization ruleset on `main`
# (`lint`, `test`, `security`). Runs on every pull request -- not just
# markdown ones -- because a required check that never reports leaves a PR
# blocked forever.
#
# Deliberately minimal, in keeping with .github/copilot-instructions.md:
# this repo is a small public vision-doc bundle, so each job is a real but
# lightweight check and none of them write to the repo, open issues, or
# post comments.
on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate changed markdown against OKF v0.2
        run: python scripts/okf/validate_okf_markdown.py --changed

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validators are syntactically valid
        run: |
          python -m py_compile scripts/okf/validate_okf_markdown.py
          python -m py_compile scripts/provenance/validate_provenance.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Whole bundle conforms to OKF v0.2
        run: |
          python scripts/okf/validate_okf_markdown.py --all | tee baseline.txt
          if grep -q '^REPORT ' baseline.txt; then
            echo "::error::Non-conformant markdown found in the OKF bundle baseline."
            exit 1
          fi

      - name: Provenance record conforms to schema v0.1
        run: python scripts/provenance/validate_provenance.py --file .seventwos/provenance.json

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Workflows avoid pull_request_target
        run: |
          if grep -rnE '^[[:space:]]*pull_request_target:' .github/workflows; then
            echo "::error::pull_request_target runs with repo write scope on fork PRs; not appropriate for this public repo."
            exit 1
          fi
          echo "No pull_request_target triggers found."

      # There used to be a companion "no write permissions anywhere in
      # .github/workflows" grep here. It was removed: this repo legitimately
      # has push/workflow_dispatch-triggered automation (graphify.yml,
      # graphify-catchup.yml) that needs contents/pull-requests write to open
      # its own PRs, and a text grep cannot reliably distinguish that trusted,
      # non-PR-triggered write access from an untrusted PR-triggered one
      # without exactly the kind of fragile custom YAML/permission parsing
      # this repo has deliberately chosen not to maintain (see SECURITY.md).
      # The pull_request_target check above remains because it is narrow
      # (only the trigger keyword) and doesn't collide with legitimate,
      # non-PR-triggered write permissions elsewhere in the repo.
