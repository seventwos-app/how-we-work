name: CI

# Provides the status checks required by the organization ruleset on `main`
# (`lint`, `test`, `security`). Runs on every pull request -- not just
# markdown ones -- because a required check that never reports leaves a PR
# blocked forever.
#
# Deliberately minimal, in keeping with .github/copilot-instructions.md:
# this repo is a small public vision-doc bundle, so each job is a real but
# lightweight check and none of them write to the repo, open issues, or
# post comments.
on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.x"

      - name: Validate changed markdown against OKF v0.2
        run: python scripts/okf/validate_okf_markdown.py --changed

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.x"

      - name: Validators are syntactically valid
        run: |
          python -m py_compile scripts/okf/validate_okf_markdown.py
          python -m py_compile scripts/provenance/validate_provenance.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Whole bundle conforms to OKF v0.2
        run: |
          python scripts/okf/validate_okf_markdown.py --all | tee baseline.txt
          if grep -q '^REPORT ' baseline.txt; then
            echo "::error::Non-conformant markdown found in the OKF bundle baseline."
            exit 1
          fi

      - name: Provenance record conforms to schema v0.1
        run: python scripts/provenance/validate_provenance.py --file .seventwos/provenance.json

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Workflows avoid pull_request_target
        run: |
          if grep -rnE '^[[:space:]]*pull_request_target:' .github/workflows; then
            echo "::error::pull_request_target runs with repo write scope on fork PRs; not appropriate for this public repo."
            exit 1
          fi
          echo "No pull_request_target triggers found."

      - name: Trusted write-permission workflows have no pull-request triggers
        # graphify.yml and graphify-catchup.yml legitimately need
        # contents/pull-requests write to open their own automated PRs,
        # but that trust is only safe because neither of them runs in a
        # pull_request/pull_request_target context (i.e. never on
        # untrusted, PR-controlled input). Assert that invariant
        # explicitly, on an exact allowlist, before trusting their write
        # permissions in the next step.
        run: |
          set -euo pipefail
          trusted="graphify.yml graphify-catchup.yml"
          for f in $trusted; do
            path=".github/workflows/$f"
            if [ ! -f "$path" ]; then
              echo "::error::Expected trusted workflow $path not found."
              exit 1
            fi
            if grep -nE '^[[:space:]]*pull_request(_target)?:' "$path"; then
              echo "::error::$path is only trusted to request write permissions because it has no pull_request trigger; one was found."
              exit 1
            fi
          done
          echo "Trusted write-permission workflows confirmed to have no pull_request/pull_request_target trigger."

      - name: Other workflows do not request write permissions
        # Every workflow except the explicitly-vetted allowlist above
        # must stay read-only, since a workflow that runs on
        # pull_request/pull_request_target with write permissions would
        # let a fork PR write to this repo or exfiltrate secrets.
        run: |
          set -euo pipefail
          trusted="./.github/workflows/graphify.yml ./.github/workflows/graphify-catchup.yml"
          fail=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            skip=0
            for t in $trusted; do
              if [ "./$f" = "$t" ]; then
                skip=1
              fi
            done
            if [ "$skip" -eq 1 ]; then
              continue
            fi
            if grep -nE '^[[:space:]]*(contents|issues|pull-requests|packages|id-token):[[:space:]]*(write|write-all)' "$f" \
              || grep -nE '^[[:space:]]*permissions:[[:space:]]*write-all' "$f"; then
              echo "::error::$f requests write permissions but is not in the trusted write-permission allowlist."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "All non-allowlisted workflows are read-only."
