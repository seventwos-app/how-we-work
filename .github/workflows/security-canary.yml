name: Security Canary (advisory)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-static:
    name: advisory / policy and static HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Compile security canary
        run: python -m py_compile scripts/security/static_canary.py

      - name: Check workflow policy and static HTML
        run: python scripts/security/static_canary.py

  secret-scan:
    name: advisory / secret scan fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download gitleaks (checksum verified)
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksum="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${checksum}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          chmod +x gitleaks

      - name: Download trusted gitleaks ruleset (checksum verified)
        # Pin to gitleaks' own default ruleset at the exact commit the
        # v8.30.1 tag points to, downloaded outside the PR checkout so a
        # PR cannot smuggle a permissive .gitleaks.toml/.gitleaksignore to
        # silently disable rules for its own diff.
        run: |
          set -euo pipefail
          commit=83d9cd684c87d95d656c1458ef04895a7f1cbd8e
          checksum="e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf"
          config_path="${RUNNER_TEMP}/gitleaks.toml"
          curl -fsSL -o "${config_path}" \
            "https://raw.githubusercontent.com/gitleaks/gitleaks/${commit}/config/gitleaks.toml"
          echo "${checksum}  ${config_path}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks-ignore-dir"

      - name: Scan Git history with gitleaks
        run: |
          ./gitleaks git \
            --redact --no-banner --exit-code 1 \
            --config "${RUNNER_TEMP}/gitleaks.toml" \
            --gitleaks-ignore-path "${RUNNER_TEMP}/gitleaks-ignore-dir" \
            --ignore-gitleaks-allow \
            .

  dependency-review:
    name: advisory / dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed dependency manifests
        id: manifest-diff
        # Matches every manifest/lockfile GitHub's dependency graph (and
        # therefore dependency-review-action, which diffs that graph)
        # recognizes, so the review step only runs when it can actually
        # find something to compare. Deliberately excludes the GitHub
        # Actions ecosystem (workflow `uses:` pins): those are already
        # enforced independently by SECWF004 above, and this repo's own
        # workflow files change far more often than any real dependency
        # manifest would, so including them here would make this
        # advisory job noisy without adding coverage.
        run: |
          set -euo pipefail
          pattern='(^|/)(package\.json|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|requirements\.txt|Pipfile|Pipfile\.lock|poetry\.lock|pyproject\.toml|setup\.py|go\.mod|go\.sum|Gemfile|Gemfile\.lock|[^/]+\.gemspec|Cargo\.toml|Cargo\.lock|pom\.xml|packages\.config|packages\.lock\.json|[^/]+\.(csproj|fsproj|vbproj|vcxproj|nuspec)|composer\.json|composer\.lock|pubspec\.yaml|pubspec\.lock|Package\.resolved|Manifest\.toml|Project\.toml|deno\.json|deno\.jsonc|deno\.lock|MODULE\.bazel|MODULE\.bazel\.lock|WORKSPACE|maven_install\.json|[^/]+\.MODULE\.bazel)$'
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep -Eq "${pattern}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Review dependencies when the pull request changes a supported manifest
        if: steps.manifest-diff.outputs.changed == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          comment-summary-in-pr: never
