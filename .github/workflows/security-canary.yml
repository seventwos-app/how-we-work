name: Gitleaks Secret-Scan Canary (advisory)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: advisory / secret scan fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download gitleaks (checksum verified)
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksum="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${checksum}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          chmod +x gitleaks

      - name: Download trusted gitleaks ruleset (checksum verified)
        # Pin to gitleaks' own default ruleset at the exact commit the
        # v8.30.1 tag points to, downloaded outside the PR checkout so a
        # PR cannot smuggle a permissive .gitleaks.toml/.gitleaksignore to
        # silently disable rules for its own diff.
        run: |
          set -euo pipefail
          commit=83d9cd684c87d95d656c1458ef04895a7f1cbd8e
          checksum="e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf"
          config_path="${RUNNER_TEMP}/gitleaks.toml"
          curl -fsSL -o "${config_path}" \
            "https://raw.githubusercontent.com/gitleaks/gitleaks/${commit}/config/gitleaks.toml"
          echo "${checksum}  ${config_path}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks-ignore-dir"

      - name: Remove any PR-controlled gitleaks config/ignore files from the checkout
        # gitleaks always additionally looks up ./.gitleaksignore relative
        # to the scanned source path even when --gitleaks-ignore-path
        # points elsewhere, so a working-tree .gitleaksignore checked out
        # from the pull request would still be honored and could suppress
        # findings in its own diff. Deleting the working-tree copies here
        # (not from git history, which is what --config/-i above already
        # supersede) closes that gap without affecting the git-log-based
        # history scan below.
        run: rm -f .gitleaksignore .gitleaks.toml

      - name: Scan Git history with gitleaks
        run: |
          ./gitleaks git \
            --redact --no-banner --exit-code 1 \
            --config "${RUNNER_TEMP}/gitleaks.toml" \
            --gitleaks-ignore-path "${RUNNER_TEMP}/gitleaks-ignore-dir" \
            --ignore-gitleaks-allow \
            .
