name: Security Canary (advisory)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-static:
    name: advisory / policy and static HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Compile security canary
        run: python -m py_compile scripts/security/static_canary.py

      - name: Check workflow policy and static HTML
        run: python scripts/security/static_canary.py

  secret-scan:
    name: advisory / secret scan fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download gitleaks (checksum verified)
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksum="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${checksum}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          chmod +x gitleaks

      - name: Scan Git history with gitleaks
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  dependency-review:
    name: advisory / dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed dependency manifests
        id: manifest-diff
        run: |
          set -euo pipefail
          pattern='(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|requirements\.txt|Pipfile\.lock|poetry\.lock|go\.sum|Gemfile\.lock|Cargo\.lock|pom\.xml|packages\.lock\.json|composer\.lock|pubspec\.lock)$'
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep -Eq "${pattern}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Review dependencies when the pull request changes a supported manifest
        if: steps.manifest-diff.outputs.changed == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          comment-summary-in-pr: never
